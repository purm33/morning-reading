<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자료실 · 우리 반</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
:root{--accent:#2f6db8;--soft:#dde9f7}
.wrap{max-width:1180px}
.layout{display:grid;grid-template-columns:230px 1fr;gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.subj{display:flex;flex-direction:column;gap:6px;position:sticky;top:70px}
@media (max-width:820px){.subj{flex-direction:row;flex-wrap:wrap;position:static}}
.sb{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 12px;font-family:'Jua';font-size:19px;color:var(--ink);text-align:left}
.sb .ic{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:19px;background:var(--c);flex:none}
.sb .n{margin-left:auto;font-size:14px;color:var(--muted);font-family:'Gowun Dodum'}
.sb:hover{border-color:var(--cc)}
.sb.on{background:var(--c);border-color:var(--cc)}
@media (max-width:820px){.sb{font-size:16px;padding:6px 10px}.sb .ic{width:28px;height:28px;font-size:16px}}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head .t{font-family:'Jua';font-size:32px;display:flex;align-items:center;gap:10px}
.head .t .ic{width:48px;height:48px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;font-size:28px;background:var(--c)}
.head .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{width:220px!important;font-size:16px!important;padding:7px 12px!important;border-radius:999px!important}
.unit{margin:18px 0 8px;font-family:'Jua';font-size:21px;color:var(--cc);display:flex;align-items:center;gap:8px}
.unit::after{content:'';flex:1;height:2px;background:var(--line)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.it{position:relative;display:flex;flex-direction:column;background:#fff;border:2px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;color:var(--ink);transition:transform .12s, box-shadow .12s}
.it:hover{transform:translateY(-2px);box-shadow:0 5px 0 var(--line);border-color:var(--cc)}
.it .thumb{height:140px;background:#000 center/cover no-repeat;position:relative}
.it .thumb::after{content:'▶';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,0,0,.85);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px}
.it .bd{padding:10px 14px 12px;display:flex;gap:10px;align-items:flex-start}
.it .ty{flex:none;width:38px;height:38px;border-radius:11px;background:var(--c);display:flex;align-items:center;justify-content:center;font-size:20px}
.it .tt{font-family:'Jua';font-size:18px;line-height:1.3}
.it .nt{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.4}
.it .dm{font-size:12px;color:#a59b8f;margin-top:3px;word-break:break-all}
.it .ed{display:flex;gap:4px;justify-content:flex-end;padding:0 10px 10px;margin-top:auto}
.it .ed button{border:2px solid var(--line);background:#fff;border-radius:8px;width:32px;height:30px;font-size:14px}
.it .ed button:hover{border-color:var(--cc)}
.empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:17px}
.empty .big{font-size:52px}
.form{background:var(--soft);border:2px dashed var(--cc);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.form .g{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.form label{display:block;font-family:'Jua';font-size:15px;margin-bottom:3px}
.form input,.form select{font-size:16px!important;padding:7px 10px!important;border-radius:10px!important}
.form .row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
@media (max-width:640px){.form .g{grid-template-columns:1fr}}
.auth{display:flex;align-items:center;gap:8px;font-size:15px}
.badge{font-family:'Jua';font-size:14px;padding:3px 10px;border-radius:999px;background:#e3f3e6;color:#2e7d4a}
</style>
</head>
<body data-tab="materials" data-site="teacher">
<script src="nav.js"></script>
<div class="wrap">
  <div id="warn"></div>
  <div class="layout">
    <div class="subj" id="subj"></div>
    <div>
      <div class="card" id="main"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="materials.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2400)}

/* 과목 (창체 포함) — 순서·색은 여기서 바꿔요 */
const SUBJ=[
 ['kor','📖','국어','#fde8e4','#d9644f'], ['math','🔢','수학','#ece2f6','#7a4bb3'],
 ['soc','🏛️','사회','#fff1d6','#c98a12'], ['sci','🔬','과학','#e3f3e6','#2e9d5b'],
 ['eng','🔤','영어','#e2eefb','#2f6db8'], ['mor','🌱','도덕','#eaf6dc','#5c9a2c'],
 ['prac','💻','실과','#e5f6f6','#1f8f8f'], ['mus','🎵','음악','#fde6f1','#c0457e'],
 ['art','🎨','미술','#fff0e0','#e07a1f'], ['pe','⚽','체육','#e6f0ff','#3b6fd6'],
 ['cre','🌈','창체','#f3ecff','#8a5cd6']
];
const SI={};SUBJ.forEach(s=>SI[s[0]]=s);

/* 링크 종류 알아보기 */
function ytId(u){const m=String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/|live\/))([\w-]{11})/);return m?m[1]:null}
function kind(u){u=String(u||'').toLowerCase();
  if(ytId(u))return ['🎬','영상'];
  if(u.includes('drive.google.com')||u.includes('docs.google.com/')){
    if(u.includes('/presentation/'))return ['📊','구글 슬라이드'];
    if(u.includes('/spreadsheets/'))return ['📈','구글 시트'];
    if(u.includes('/document/'))return ['📝','구글 문서'];
    if(u.includes('/forms/'))return ['📋','구글 설문'];
    if(u.includes('/folders/'))return ['📁','드라이브 폴더'];
    return ['📄','드라이브 파일']}
  if(u.endsWith('.mcworld')||u.includes('mcworld'))return ['⛏️','마크 맵'];
  if(u.endsWith('.pdf'))return ['📕','PDF'];
  if(u.includes('padlet.com'))return ['📌','패들렛'];
  if(u.includes('notion.site')||u.includes('notion.so'))return ['🗒️','노션'];
  if(u.includes('makecode'))return ['🎮','메이크코드'];
  if(u.includes('github.io'))return ['🧩','우리 반 앱'];
  return ['🔗','웹사이트']}
function host(u){try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}}
function fixUrl(u){u=String(u||'').trim();if(u&&!/^https?:\/\//i.test(u))u='https://'+u;return u}

let Q='', CUR=(location.hash||'').slice(1);
if(!SI[CUR])CUR='kor';
const ITEMS=(window.MATERIALS||[]).map((v,i)=>({...v,o:i}));
function list(sub){return ITEMS.filter(v=>v.s===sub)}
function match(v){if(!Q)return true;const q=Q.toLowerCase();return [v.t,v.n,v.unit,v.u].some(x=>String(x||'').toLowerCase().includes(q))}

/* ---------- 그리기 ---------- */
function drawSubj(){
  $('subj').innerHTML=SUBJ.map(([k,e,n,c,cc])=>{const cnt=list(k).length;
    return `<button class="sb ${k===CUR?'on':''}" data-k="${k}" style="--c:${c};--cc:${cc}"><span class="ic">${e}</span>${n}<span class="n">${cnt||''}</span></button>`}).join('');
  $('subj').querySelectorAll('.sb').forEach(b=>b.onclick=()=>{CUR=b.dataset.k;history.replaceState(null,'',location.pathname+'#'+CUR);draw();window.scrollTo({top:0,behavior:'smooth'})});
}
function itemHTML(v,c){
  const [e,label]=kind(v.u), y=ytId(v.u);
  return `<a class="it" href="${esc(v.u)}" target="_blank" rel="noopener" style="--c:${c[3]};--cc:${c[4]}">
    ${y?`<div class="thumb" style="background-image:url('https://img.youtube.com/vi/${y}/mqdefault.jpg')"></div>`:''}
    <div class="bd"><div class="ty">${e}</div><div><div class="tt">${esc(v.t||label)}</div>${v.n?`<div class="nt">${esc(v.n)}</div>`:''}<div class="dm">${label} · ${esc(host(v.u))}</div></div></div></a>`;
}
function draw(){
  drawSubj();
  const c=SI[CUR], items=list(CUR).filter(match);
  let h=`<div class="head"><div class="t" style="--c:${c[3]}"><span class="ic">${c[1]}</span>${c[2]} 자료실</div>
    <div class="right"><input type="text" class="search" id="q" placeholder="🔍 자료 찾기" value="${esc(Q)}"></div></div>`;
  if(!items.length){
    h+=`<div class="empty"><div class="big">${c[1]}</div>${Q?'찾는 자료가 없어요.':'아직 자료가 없어요.<br><span style="font-size:15px">넣고 싶은 링크를 Claude에게 알려 주시면 이 칸에 넣어 드려요.</span>'}</div>`;
  } else {
    const groups=[];const gi={};
    items.forEach(v=>{const u=v.unit||'';if(!(u in gi)){gi[u]=groups.length;groups.push([u,[]])}groups[gi[u]][1].push(v)});
    groups.sort((a,b)=>(a[0]===''?-1:0)-(b[0]===''?-1:0));
    h+=groups.map(([u,L])=>`${u?`<div class="unit" style="--cc:${c[4]}">${esc(u)}</div>`:''}<div class="items" ${u?'':'style="margin-top:6px"'}>${L.map(v=>itemHTML(v,c)).join('')}</div>`).join('');
  }
  $('main').innerHTML=h;
  bind();
}
function bind(){
  const q=$('q'); q.oninput=()=>{Q=q.value;const p=q.selectionStart;draw();const nq=$('q');nq.focus();nq.setSelectionRange(p,p)};
}
draw();
</script>
</body>
</html>
